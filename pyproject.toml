[project]
name = "n1cepdf"
version = "1.0.0"
description = "Offline desktop PDF editor"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "pypdfium2>=4.30", "pikepdf>=9", "reportlab>=4", "Pillow>=10"]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["."]
# If a test stalls, dump every thread's stack after 90 s (shows exactly where it is stuck).
faulthandler_timeout = 90
